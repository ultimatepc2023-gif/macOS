name: macOS Remote Desktop (RustDesk)

on:
  workflow_dispatch:

jobs:
  rustdesk-gui:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Admin User
        run: |
          PASSWORD="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="123456"
          fi
          echo "::add-mask::$PASSWORD"

          USERNAME="abicloudpc"
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/bash
          sudo dscl . -create /Users/$USERNAME RealName "Abi Cloud PC"
          sudo dscl . -create /Users/$USERNAME UniqueID 502
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          sudo createhomedir -c -u $USERNAME > /dev/null 2>&1 || true

      - name: Install & Run RustDesk Server
        run: |
          # Install RustDesk via Homebrew
          brew install --cask rustdesk

          # Start RustDesk service
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --service &
          sleep 5

          # Set permanent password
          PASSWORD="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="123456"
          fi
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$PASSWORD"

          # Get RustDesk ID
          RUSTDESK_ID=""
          for i in {1..15}; do
            RUSTDESK_ID=$(sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id 2>/dev/null | tr -d ' \n\r')
            if [[ "$RUSTDESK_ID" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 2
          done

          echo "RUSTDESK_ID=$RUSTDESK_ID" >> $GITHUB_ENV
          sudo caffeinate -d -i -m -u &

      - name: Maintain Active Runner Loop
        run: |
          echo ""
          echo "======================================================="
          echo "MAC REMOTE DESKTOP READY (RUSTDESK)"
          echo "RustDesk ID : $RUSTDESK_ID"
          echo "Password    : [PROTECTED BY RDP_PASSWORD SECRET]"
          echo "======================================================="
          echo ""

          while true; do
            echo "[$(date)] Mac Runner Active..."
            sleep 300
          done
