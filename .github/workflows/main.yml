name: macOS

on:
  workflow_dispatch:

jobs:
  macOS:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Timezone & User Account
        run: |
          # 1. Set System Time Zone to UTC+05:30
          sudo systemsetup -settimezone "Asia/Colombo"

          # 2. Get password from secrets (or fallback)
          PASSWORD="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="123456"
          fi
          echo "::add-mask::$PASSWORD"

          # 3. Create administrator account explicitly
          USERNAME="abicloudpc"
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/bash
          sudo dscl . -create /Users/$USERNAME RealName "Abi Cloud PC"
          sudo dscl . -create /Users/$USERNAME UniqueID 502
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          sudo createhomedir -c -u $USERNAME > /dev/null 2>&1 || true

      - name: Enable Screen Sharing, VNC & Open Firewall
        run: |
          PASSWORD="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="123456"
          fi

          # 1. Enable VNC Legacy Password & Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy yes -vnclegacy yes

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpw -vncpasswd "$PASSWORD"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users runner,abicloudpc -access -on -privs -all

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -console

          # 2. Unblock Port 5900 in macOS Application Firewall
          FW="/Library/Preferences/com.apple.alf/facility"
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --add /System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --unblockapp /System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

          # 3. Prevent system/display sleep
          sudo caffeinate -d -i -m -u &

      - name: Install & Connect Tailscale
        run: |
          brew install tailscale
          sudo tailscaled --state=mem: &
          sleep 5

          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-mac-runner-$GITHUB_RUN_ID"

          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null | tr -d ' \n\r')
            if [[ $TS_IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              break
            fi
            sleep 3
          done

          if [ -z "$TS_IP" ]; then
            echo "Error: Tailscale IP assignment timed out."
            exit 1
          fi

          echo "Tailscale IP assigned successfully: $TS_IP"
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Maintain Active Runner Loop
        run: |
          echo ""
          echo "======================================================="
          echo "MAC REMOTE DESKTOP READY"
          echo "VNC Address : $TAILSCALE_IP:5900"
          echo "Username    : abicloudpc  (or runner)"
          echo "Password    : [PROTECTED BY RDP_PASSWORD SECRET]"
          echo "======================================================="
          echo ""

          while true; do
            echo "[$(date)] Mac Runner VNC Engine Active..."
            sleep 300
          done
