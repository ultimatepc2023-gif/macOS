name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Timezone & User Account
        run: |
          # 1. Set System Time Zone to UTC+05:30
          sudo systemsetup -settimezone "Asia/Colombo"

          # 2. Setup Password from Secrets or Default
          PASSWORD="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="123456"
          fi
          echo "::add-mask::$PASSWORD"

          # 3. Create Admin User
          USERNAME="abicloudpc"
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/bash
          sudo dscl . -create /Users/$USERNAME RealName "Abi Cloud PC"
          sudo dscl . -create /Users/$USERNAME UniqueID 502
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          sudo createhomedir -c -u $USERNAME > /dev/null 2>&1 || true

      - name: Enable macOS Screen Sharing (Native VNC)
        run: |
          PASSWORD="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="123456"
          fi

          # Reset ARD Agent settings
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop

          # Allow access for all users with full privileges
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all

          # Set VNC password directly
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy yes -setvncpw -vncpasswd "$PASSWORD"

          # Activate agent
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -restart -agent -console

          # Prevent display/system sleep
          sudo caffeinate -d -i -m -u &

      - name: Start Free TCP Tunnel (Bore)
        run: |
          # Download and extract bore CLI for macOS
          curl -LO https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-apple-darwin.tar.gz
          tar -xzf bore-v0.5.0-x86_64-apple-darwin.tar.gz
          chmod +x bore

          # Start background TCP tunnel forwarding local port 5900 to bore.pub
          ./bore local 5900 --to bore.pub > bore.log 2>&1 &
          sleep 5

          # Robust log parsing logic (extracts remote port safely)
          BORE_PORT=$(grep -oE 'bore\.pub:[0-9]+|remote_port=[0-9]+' bore.log | grep -oE '[0-9]+' | head -n 1)

          if [ -z "$BORE_PORT" ]; then
            echo "Error starting bore tunnel. Logs:"
            cat bore.log
            exit 1
          fi

          echo "BORE_PORT=$BORE_PORT" >> $GITHUB_ENV

      - name: Maintain Active Runner Loop
        run: |
          echo ""
          echo "======================================================="
          echo "MAC REMOTE DESKTOP READY"
          echo "VNC Host : bore.pub"
          echo "VNC Port : $BORE_PORT"
          echo "Username : abicloudpc  (or runner)"
          echo "Password : [PROTECTED BY RDP_PASSWORD SECRET]"
          echo "======================================================="
          echo ""

          while true; do
            echo "[$(date)] Mac Runner VNC Engine Active..."
            sleep 300
          done
